name: CI

on:
  push:
    branches: ["**"]

jobs:
  # ── Backend lint ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check backend/

  # ── Backend tests ─────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run pytest
        run: pytest backend/tests/ -v

  # ── Frontend build ────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Repo graph is up to date ──────────────────────────────────
  # The graph tooling uses only the standard library, so nothing is installed
  # before `make graph`.
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the repo graph
        run: make graph

      - name: Fail if docs/repo-graph/ is stale
        run: |
          git diff --exit-code docs/repo-graph/ || {
            echo "::error::docs/repo-graph/ is stale. Run 'make graph' and commit the result."
            exit 1
          }

      - name: Test the graph tooling
        run: |
          pip install pytest
          pytest tools/repo_graph/tests -q

  # ── Deploy to Render (main only) ──────────────────────────────
  deploy-render:
    if: github.ref == 'refs/heads/main'
    needs: [lint, test, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}"
