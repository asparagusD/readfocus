name: League rollover

# The weekly league rollover (docs/GAMIFICATION.md G11, C24.4): every Monday
# at 00:05 UTC, POST /internal/leagues/rollover with the CRON_SECRET bearer
# token. The endpoint is idempotent, so a retry, a late run or a manual run is
# safe; GET /league also rolls any overdue week (C24.5), so a dropped or
# delayed schedule only delays the result.
#
# GitHub runs schedules only from the default branch (main), may delay or drop
# them under load, and pauses them in a public repository after 60 days
# without activity.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   BACKEND_URL  the backend's base URL, e.g. https://<service>.onrender.com
#   CRON_SECRET  the same value as the backend's CRON_SECRET (32+ characters)

on:
  schedule:
    - cron: "5 0 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: league-rollover
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the backend and run the rollover
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the BACKEND_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          # Render Free sleeps when idle and takes about a minute to wake:
          # retry every 20 s, up to 6 times, each try allowed 120 s.
          curl --silent --show-error --fail-with-body \
            --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${BACKEND_URL%/}/internal/leagues/rollover"
          echo
