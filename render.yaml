# Render blueprint for the backend: one Docker web service on the Free plan
# (0.1 CPU, 512 MB, spins down after 15 min idle). No payment method needed.
# Secrets are entered in the Render dashboard (sync: false), never here.
# Everything but Steve runs in the image. Steve (optional) calls Google Gemini
# from backend/steve/provider.py only; his key and the other phase-2 secrets
# below are set in the dashboard, never here (C25.2; docs/DEPLOYMENT.md).
services:
  - type: web
    name: readfocus-backend
    runtime: docker
    plan: free
    # region is left at Render's default (oregon) until it is chosen in
    # C14.6; it cannot be changed after the service is created.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploys come only from CI after the checks pass on main (C14.5).
    autoDeployTrigger: "off"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FASTEMBED_CACHE
        value: /app/.cache/fastembed
      - key: ENV
        value: production
      # Phase 2 (C25.2). Steve: Gemini's free tier, no billing account.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_CHAT
        sync: false
      - key: GEMINI_MODEL_VISION
        sync: false
      - key: STEVE_DAILY_LIMIT_PER_USER
        sync: false
      # Encrypts readers' own Gemini keys (32+ characters; changing it voids stored keys).
      - key: KEY_ENCRYPTION_SECRET
        sync: false
      # Bearer token of POST /internal/leagues/rollover (32+ characters; the same value as GitHub's).
      - key: CRON_SECRET
        sync: false
